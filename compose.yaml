name: flowdesk

services:
  app:
    container_name: flowdesk-app
    build:
      context: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      REVERB_HOST: reverb
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    container_name: flowdesk-queue
    build:
      context: .
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=210
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/var/www/html
    environment:
      REVERB_HOST: reverb
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  reverb:
    container_name: flowdesk-reverb
    build:
      context: .
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy

  ollama:
    container_name: flowdesk-ollama
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  mysql:
    container_name: flowdesk-mysql
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: flowdesk
      MYSQL_USER: flowdesk
      MYSQL_PASSWORD: flowdesk
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    container_name: flowdesk-redis
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  ollama-data:
